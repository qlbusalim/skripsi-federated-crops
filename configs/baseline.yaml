project:
  name: federated-crops-production-prediction
  mode: centralized  # centralized | federated
  seed: 42

paths:
  final_dataset: data/processed/final_province_dataset.csv
  output_dir: results

data:
  date_column: date
  group_column: province
  target_column: paddy_prod
  feature_columns:
    - PRECTOTCORR
    - RH2M
    - T2M
    - harvested_area
  sequence:
    window_size: 10
    horizon: 1

split:
  train_end: 2023-12-01
  validation_end: 2024-12-01

centralized:
  expected_clients: 5

tuning:
  n_trials: 50
  epochs: 40
  device: cuda
  study_name: centralized_model_tuning
  storage: sqlite:///results/optuna/centralized_study.db
  pruner_startup_trials: 5
  pruner_warmup_steps: 2
  learning_rate_min: 0.0001
  learning_rate_max: 0.01
  search_space:
    model_name: [rnn, lstm, gru, bilstm, bigru]
    hidden_size: [2, 4, 8, 16, 32]
    num_layers: [1, 2, 3, 4]
    window_size: [3, 6, 8, 10, 12]
    optimizer: [adam, adamw]
    batch_size: [2, 4, 8]
    loss: [mae, mse]

model:
  name: bilstm # rnn | lstm | gru | bilstm | bigru 
  input_size: 4
  hidden_size: 8
  num_layers: 1
  output_size: 1

training:
  loss: mae
  optimizer: adam
  learning_rate: 0.01
  scheduler:
    name: reduce_on_plateau
    factor: 0.5
    patience: 2
    threshold: 0.0001
    min_lr: 0.000001
  epochs: 100
  batch_size: 2
  device: cuda
  patience: 5
  min_delta: 0.0
  verbose: 1

federated:
  enabled: false
  rounds: 10
  local_epochs: 1
  fraction_fit: 1.0
  fraction_evaluate: 1.0

evaluation:
  metrics:
    - mae
    - rmse
